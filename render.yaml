databases:
  - name: clipboard-db
    plan: free
    databaseName: clipboard

services:
  - type: web
    name: clipboard-todo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: clipboard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
