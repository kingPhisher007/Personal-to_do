<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clipboard</title>
  <meta name="theme-color" content="#6a4727">
  <meta name="description" content="Your personal cloud clipboard and to-do list.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/paper.css">
</head>
<body>

  <main id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="login-brand">
        <svg viewBox="0 0 128 128" width="34" height="34" aria-hidden="true"><use href="/icons/icon.svg#m"/></svg>
        <h1>Clipboard</h1>
      </div>
      <p class="login-sub">Log in to see what you saved.</p>
      <label class="field"><span>Username</span>
        <input id="u" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span>Password</span>
        <input id="p" type="password" autocomplete="current-password" required></label>
      <p id="loginErr" class="login-err" role="alert"></p>
      <button class="btn primary wide" type="submit">Log in</button>
    </form>
  </main>

  <div id="app" class="shell hidden">
    <header class="top">
      <div class="top-in">
        <div class="brand">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open the side panel" aria-expanded="false"></button>
          <svg viewBox="0 0 128 128" width="26" height="26" aria-hidden="true"><use href="/icons/icon.svg#m"/></svg>
          <span>Clipboard</span>
        </div>
        <button class="search-btn" id="searchBtn" type="button">
          <span class="search-ic" id="searchIc"></span>
          <span class="search-txt">Search or run a command</span>
          <kbd id="kbdHint">Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <div class="live" id="live" role="status" title="Live sync"><i></i><span>Connecting</span></div>
          <button class="icon-btn" id="backupBtn" type="button" aria-label="Backup and restore" title="Backup and restore"></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme" title="Theme" aria-haspopup="menu"></button>
          <button class="icon-btn hidden" id="installBtn" type="button" aria-label="Install app" title="Install app"></button>
          <button class="icon-btn" id="logoutBtn" type="button" aria-label="Log out" title="Log out"></button>
        </div>
      </div>
    </header>

    <div class="body">
    <aside id="side" class="side" aria-label="Side panel"></aside>
    <div class="content">
    <section class="main" id="main">
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="newText" rows="1" placeholder="Paste, type, or drop a file here" aria-label="New entry"></textarea>
        <div class="c-row">
          <button class="chip-btn" id="attachBtn" type="button" title="Attach files"></button>
          <button class="chip-btn toggle" id="taskBtn" type="button" role="switch" aria-checked="false" title="Make this a task"></button>
          <span class="spacer"></span>
          <div class="fuse-pick" id="fusePick" role="radiogroup" aria-label="Delete after"></div>
          <button class="btn primary" type="submit" id="addBtn">Save</button>
        </div>
      </form>

      <nav id="nav" class="tabs" aria-label="Views"></nav>
      <div id="viewbar" class="viewbar hidden"></div>

      <section id="shelfWrap" class="shelf-wrap hidden" aria-label="Pinned entries">
        <h2 class="shelf-title" id="shelfTitle"></h2>
        <div id="shelf" class="shelf"></div>
      </section>

      <h2 class="feed-title hidden" id="feedTitle">Everything else</h2>
      <div id="feed" class="feed"></div>
      <div id="empty" class="empty hidden"></div>
    </section>
    <section class="main wide hidden" id="planMain" aria-label="Plan"></section>
    <section class="main wide hidden" id="diaryMain" aria-label="Diary"></section>
    </div>
    </div>
    <div id="scrim" class="scrim hidden"></div>
  </div>

  <input type="file" id="picker" multiple class="hidden">

  <dialog id="dlgPalette" class="dlg palette" aria-label="Search and commands"></dialog>
  <dialog id="dlgShare" class="dlg share" aria-label="Share a link"></dialog>
  <dialog id="dlgBackup" class="dlg share" aria-label="Backup and restore"></dialog>
  <dialog id="dlgLight" class="dlg light" aria-label="Image preview"></dialog>

  <div id="menuHost"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="veil" class="veil hidden"><div><b>Drop to save</b><span>Drop on an entry to attach, or anywhere else for a new one</span></div></div>

  <script src="/app.js" defer></script>
  <script src="/panel.js" defer></script>
  <script src="/plan.js" defer></script>
  <script src="/diary.js" defer></script>
</body>
</html>
